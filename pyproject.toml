[project]
name = "batkol"
version = "0.1.0"
description = "Language-learning audio cut from real native speech: Pimsleur-style lessons and interleaved audiobooks"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "faster-whisper>=1.1",
    "sentence-transformers>=3.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "num2words>=0.5.13",
    "piper-tts>=1.8.0",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[tool.uv]
# Locked for the laptop (WSL2 Ubuntu, x86_64, no GPU): torch and torchaudio come from
# the PyTorch CPU index, so no CUDA or triton wheels (docs/local_plan.md §6).
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
